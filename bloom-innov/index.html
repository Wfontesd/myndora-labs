    <noscript>Bloom’innov nécessite JavaScript pour fonctionner.</noscript>

    <!-- Secours pour les navigateurs intégrés qui ne proposent pas encore DecompressionStream. -->
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako_inflate.min.js"></script>
    <script>
      (() => {
        const BUILD_VERSION = '20260814-3';

        const decompressGzip = async (bytes) => {
          if ('DecompressionStream' in window) {
            try {
              const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
              return await new Response(stream).text();
            } catch (error) {
              console.warn('[Bloom’innov] Décompression native indisponible, utilisation du mode compatible.', error);
            }
          }

          if (window.pako?.ungzip) {
            return new TextDecoder('utf-8').decode(window.pako.ungzip(bytes));
          }

          throw new Error('Le navigateur intégré ne permet pas de charger ce build. Ouvre ce lien dans Safari, Chrome ou Firefox.');
        };

        const readGzipBase64 = async (paths) => {
          const parts = await Promise.all(paths.map(async (path) => {
            const response = await fetch(`${path}?v=${BUILD_VERSION}`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`Fichier manquant : ${path} (${response.status})`);
            return response.text();
          }));
          const cleanBase64 = parts.join('').replace(/\s+/g, '');
          const binary = atob(cleanBase64);
          const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
          return decompressGzip(bytes);
        };

        Promise.all([
          readGzipBase64(["./assets/css-00.dat", "./assets/css-01.dat"]),
          readGzipBase64(["./assets/app-00.dat", "./assets/app-01.dat", "./assets/app-02.dat", "./assets/app-03.dat", "./assets/app-04.dat", "./assets/app-05.dat", "./assets/app-06.dat", "./assets/app-07.dat", "./assets/app-08.dat", "./assets/app-09.dat", "./assets/app-10.dat", "./assets/app-11.dat", "./assets/app-12.dat", "./assets/app-13.dat"])
        ]).then(([css, javascript]) => {
          const style = document.createElement('style');
          style.textContent = css;
          document.head.appendChild(style);

          const script = document.createElement('script');
          script.textContent = javascript;
          document.body.appendChild(script);
        }).catch((error) => {
          console.error('[Bloom’innov build]', error);
          document.getElementById('app').innerHTML = `
            <main style="max-width:680px;margin:10vh auto;padding:32px;font:16px/1.5 system-ui;color:#173b32">
              <h1>Bloom’innov n’a pas pu démarrer</h1>
              <p>${error.message}</p>
              <button type="button" onclick="window.location.reload()" style="border:0;border-radius:999px;padding:12px 18px;background:#173b32;color:white;font:inherit;font-weight:700">Réessayer</button>
            </main>`;
        });
      })();
    </script>
