<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161616" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Bloom’innov — Bloomind</title>
</head>
<body style="margin:0;background:#f7f4ed;color:#171717;font-family:system-ui">
  <main id="boot" style="min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px">
    <strong style="font-size:clamp(34px,8vw,68px);letter-spacing:-.06em">Bloom’innov</strong>
    <span style="margin-top:12px;opacity:.65">Les idées commencent à éclore…</span>
  </main>
  <script>
    (() => {
      const VERSION = '20260814-8';
      const parts = ["./assets/v8/page-00.part", "./assets/v8/page-01.part", "./assets/v8/page-02.part", "./assets/v8/page-03.part", "./assets/v8/page-04.part", "./assets/v8/page-05.part", "./assets/v8/page-06.part", "./assets/v8/page-07.part", "./assets/v8/page-08.part", "./assets/v8/page-09.part", "./assets/v8/page-10.part", "./assets/v8/page-11.part", "./assets/v8/page-12.part", "./assets/v8/page-13.part", "./assets/v8/page-14.part", "./assets/v8/page-15.part", "./assets/v8/page-16.part", "./assets/v8/page-17.part", "./assets/v8/page-18.part"];
      Promise.all(parts.map(async (path) => {
        const response = await fetch(`${path}?v=${VERSION}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Fichier manquant : ${path} (${response.status})`);
        return response.text();
      })).then((chunks) => {
        document.open();
        document.write(chunks.join(''));
        document.close();
      }).catch((error) => {
        console.error('[Bloom’innov bootstrap]', error);
        document.getElementById('boot').innerHTML = `<strong style="font-size:clamp(34px,8vw,68px);letter-spacing:-.06em">Bloom’innov n’a pas pu démarrer</strong><p>${error.message}</p><button onclick="location.reload()" style="margin:18px auto 0;border:0;border-radius:999px;background:#171717;color:#fff;padding:13px 20px;font:700 16px system-ui">Réessayer</button>`;
      });
    })();
  </script>
</body>
</html>
